# Defaults shown in the Generate application stories dialog.
# These values apply to every generated story in the selected lifecycle phase.
story.export.issue-type=Story
story.export.priority=Medium
story.export.components=Application Platform
story.export.labels=application-lifecycle
story.export.feature-link=APP-LIFECYCLE-FEATURE
story.export.fix-versions=Next Release
story.export.reporter=application-team

# Comma-separated dropdown options. The configured default is automatically included.
story.export.issue-types=Story,Task,Bug
story.export.priorities=Highest,High,Medium,Low,Lowest
story.export.components-options=Application Platform,Application Runtime,Infrastructure
story.export.feature-links=APP-LIFECYCLE-FEATURE,Application Migration Feature,Application Onboarding Feature
story.export.fix-version-options=Next Release,Current Release,Backlog

# Data/Security Classification dropdown options used by the GEN-02 worksheet field.
# Comma-separated values; change this property to change the available classifications.
worksheet.data-security-classification-options=PERSONAL - NONWORK,PUBLIC - OFFICIAL RELEASE,NONCONFIDENTIAL

# Target environments available in GEN-03. Comma-separated values.
worksheet.target-environment-options=DEV,TEST,QA,PROD

# Scaling approaches available in GEN-08. Comma-separated values.
worksheet.scaling-approach-options=HORIZONTAL,VERTICAL,HYBRID,NONE
